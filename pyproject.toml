[project]
name = "polydocbench"
version = "0.1.0"
description = "Synthetic document generation and evaluation tools for OCR, layout analysis, and reading order research."
requires-python = ">=3.10"

dependencies = [
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "reportlab>=4.0.0",
    "pyyaml>=6.0.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
noise = [
    "opencv-python>=4.9.0",
    "pymupdf>=1.24.0",
]
ocr = [
    "pytesseract>=0.3.10",
    "plotly>=5.24.0",
]
dotsocr = [
    "openai>=1.30.0",
    "plotly>=5.24.0",
    "python-dotenv>=1.2.2",
]
structure = [
    "docling>=2.70.0",
    "plotly>=5.24.0",
]
formula = [
    "svglib>=1.5.1,<1.6",
]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]
all = [
    "opencv-python>=4.9.0",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.10",
    "plotly>=5.24.0",
    "openai>=1.30.0",
    "python-dotenv>=1.2.2",
    "docling>=2.70.0",
    "svglib>=1.5.1,<1.6",
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["polydocbench*"]

[project.scripts]
polydocbench = "polydocbench.cli:main"
polydocbench-api = "polydocbench.api.app:run"
