[project]
name = "polydocbench"
version = "0.1.0"
description = "Synthetic document generation and evaluation tools for OCR, layout analysis, and reading order research."
requires-python = ">=3.10"

dependencies = [
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "reportlab>=4.0.0",
    "pyyaml>=6.0.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
degradation = [
    "opencv-python>=4.9.0",
    "pymupdf>=1.24.0",
]
ocr = [
    "pytesseract>=0.3.10",
]
dev = [
    "pytest>=8.0.0",
]
all = [
    "opencv-python>=4.9.0",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.10",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
polydocbench = "polydocbench.cli:main"
